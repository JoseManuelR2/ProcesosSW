name: CD (Cloud Run)

# Despliegue continuo: cada cambio que llega a main se despliega automáticamente.
#
# El despliegue solo se ejecuta si TODOS los secretos necesarios están
# configurados en el repositorio (GCP_SA_KEY y las variables de entorno de la
# aplicación). Mientras falte alguno, el trabajo se omite (el workflow queda en
# verde) en lugar de fallar, para no bloquear el flujo de integración.
on:
  push:
    branches: [ main ]

jobs:
  credenciales:
    runs-on: ubuntu-latest
    outputs:
      disponible: ${{ steps.comprobar.outputs.disponible }}
    steps:
      - id: comprobar
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          faltan=""
          for variable in GCP_SA_KEY MONGODB_URI SESSION_SECRET ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!variable}" ]; then
              faltan="$faltan $variable"
            fi
          done
          if [ -n "$faltan" ]; then
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan secretos:$faltan. Se omite el despliegue en Cloud Run."
          else
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: credenciales
    if: needs.credenciales.outputs.disponible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar en Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: procesossw
          region: europe-west1
          source: ./
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

      - name: Mostrar la URL pública
        run: echo "Desplegado en ${{ steps.deploy.outputs.url }}"
