name: CD (Cloud Run)

# Despliegue continuo: cada cambio que llega a main se despliega automáticamente.
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar en Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: procesossw
          region: europe-west1
          source: ./
          flags: --allow-unauthenticated

      - name: Mostrar la URL pública
        run: echo "Desplegado en ${{ steps.deploy.outputs.url }}"
