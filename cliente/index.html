<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProcesosSW</title>
  <!-- Bootstrap 4 (CSS, CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    .maze-grid { display: grid; grid-template-columns: repeat(10, 32px); gap: 2px; margin: 10px 0; }
    .maze-cell { width: 32px; height: 32px; border-radius: 3px; background: #e9ecef; }
    .maze-wall { background: #343a40; }
    .maze-exit { background: #28a745; }
    .maze-p1 { background: #007bff; box-shadow: 0 0 0 2px #0056b3; }
    .maze-p2 { background: #dc3545; box-shadow: 0 0 0 2px #a71d2a; }
    .maze-path { background: #ffc107; }
    .block { display: inline-block; padding: 6px 12px; margin: 3px 0; border-radius: 6px; color: white; font-weight: bold; cursor: default; user-select: none; }
    .block-label { margin-right: 4px; }
    .block-param { border: none; border-radius: 3px; padding: 2px 4px; font-size: 0.85rem; }
    .block-del { background: rgba(0,0,0,0.2); border: none; color: white; border-radius: 3px; padding: 0 6px; cursor: pointer; font-size: 0.8rem; }
    .block-del:hover { background: rgba(0,0,0,0.4); }
    .block-children { min-height: 16px; }
    .block-palette { display: inline-block; padding: 6px 12px; margin: 3px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; user-select: none; }
    .block-palette:hover { opacity: 0.8; transform: scale(1.05); }
    .block-placeholder { color: #aaa; font-size: 0.8rem; font-style: italic; padding: 4px; }
    #paleta { display: flex; flex-wrap: wrap; gap: 4px; }
    #workspace { min-height: 200px; }
  </style>
</head>
<body>

  <!-- Barra de navegación (se rellena dinámicamente según la sesión) -->
  <nav id="barra" class="navbar navbar-expand-sm bg-dark navbar-dark"></nav>

  <div class="container-fluid">
    <div id="mensaje" class="alert alert-info d-none mt-3"></div>
    <!-- Punto de inyección de los componentes de visualización -->
    <div id="contenido"></div>
  </div>

  <!-- jQuery y Bootstrap JS (el bundle incluye Popper) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <!-- Capa de comunicación y capa de presentación (separadas) -->
  <script src="./clienteRest.js"></script>
  <script src="./controlWeb.js"></script>
  <script src="./juego.js"></script>

  <script>
    cw = new ControlWeb();
    rest = new ClienteRest(cw);
    var socket = io();
    window.juegoWeb = new JuegoWeb(cw, socket);
    configurarSocket(window.juegoWeb);
    // Cuando haya sesión, identificar al socket.
    var origIniciar = cw.iniciar.bind(cw);
    cw.iniciar = function(){
      origIniciar();
      rest.sesion(function(usuario){
        if (window.juegoWeb){ window.juegoWeb.iniciar(usuario); }
      }, function(){});
    };
    // Al cargar, comprueba si ya hay sesión (mantener sesión entre recargas).
    cw.iniciar();
  </script>
</body>
</html>
