name: CD (Cloud Run)

# Despliegue continuo: cada cambio que llega a main se despliega automáticamente.
#
# El despliegue solo se ejecuta si el secreto GCP_SA_KEY está configurado en el
# repositorio. Mientras no lo esté, el trabajo se omite (el workflow queda en
# verde) en lugar de fallar, para no bloquear el flujo de integración.
on:
  push:
    branches: [ main ]

jobs:
  credenciales:
    runs-on: ubuntu-latest
    outputs:
      disponible: ${{ steps.comprobar.outputs.disponible }}
    steps:
      - id: comprobar
        env:
          CLAVE: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$CLAVE" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::El secreto GCP_SA_KEY no está configurado; se omite el despliegue en Cloud Run."
          fi

  deploy:
    needs: credenciales
    if: needs.credenciales.outputs.disponible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar en Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: procesossw
          region: europe-west1
          source: ./
          flags: --allow-unauthenticated

      - name: Mostrar la URL pública
        run: echo "Desplegado en ${{ steps.deploy.outputs.url }}"
